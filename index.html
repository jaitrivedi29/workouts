<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORM • Recomp journal</title><style>
:root{color-scheme:dark;--bg:#101714;--panel:#1a2420;--line:#34463c;--green:#cdfa79;--muted:#adc1b2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f6ef;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px 20px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:25px;font-weight:850;letter-spacing:4px;color:var(--green)}small,.muted{color:var(--muted)}h1{font-size:clamp(32px,6vw,54px);margin:32px 0 6px;letter-spacing:-2px}h2{font-size:22px}h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0}.grid .card{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:14px;border:1px solid var(--line);border-radius:12px}.stat strong{display:block;font-size:23px;margin:8px 0}nav{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:15px 0;z-index:2;overflow:auto}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:11px;background:#101a14;color:inherit}button{cursor:pointer;min-height:44px}button.active,.primary{background:var(--green);color:#17220c;border-color:var(--green)}input,select,textarea{width:100%;margin:5px 0 12px}input[type=checkbox]{width:22px;height:22px;margin:0}label{font-size:14px;color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.row>label{flex:1}.wide{width:100%}.exercise{border-top:1px solid var(--line);padding:18px 0}.set{display:grid;grid-template-columns:32px 1fr 1fr 30px;gap:10px;align-items:center}.set input{margin:5px 0}.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:6px 10px;color:var(--green)}progress{width:100%;accent-color:var(--green)}.meal{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:14px 0}.hidden{display:none}a{color:var(--green)}.note{font-size:14px;line-height:1.6}#status{color:var(--green);min-height:25px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px 6px;border-bottom:1px solid var(--line)}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}main{padding:20px 14px 70px}header{flex-wrap:wrap}.card{padding:17px}}
</style><main><header><div class="brand">FORM<span style="color:white">.</span></div><span class="pill">YOUR RECOMP JOURNAL</span><label>Journal date<input id="date" type="date"></label></header><h1>Show up. Build steadily.</h1><p class="muted">Four full-body days. Daily nutrition. Progress you can see.</p><nav id="nav"></nav><div id="status" role="status" aria-live="polite"></div><section id="today"></section><section id="train" class="hidden"></section><section id="food" class="hidden"></section><section id="progress" class="hidden"></section><section id="settings" class="hidden"></section><footer class="muted note">Private to this browser • Export backups regularly • No accounts or automatic sync</footer></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialPlans=[['A · Monday',[['Leg press',2,'8–12'],['Machine chest press',2,'8–12'],['Chest-supported row',2,'8–12'],['Seated leg curl',2,'10–15'],['Lateral raise',2,'12–15']]],['B · Tuesday (lighter)',[['Low step-up, supported',2,'8–10 / side'],['Lat pulldown',2,'8–12'],['Incline machine press',2,'8–12'],['Seated leg curl',2,'10–15'],['Cable curl',2,'10–15']]],['C · Thursday',[['Leg press',2,'8–12'],['Chest-supported row',2,'8–12'],['Machine chest press',2,'8–12'],['Seated leg curl',2,'10–15'],['Cable triceps pressdown',2,'10–15']]],['D · Saturday (lighter)',[['Supported split squat',2,'8–10 / side'],['Lat pulldown',2,'8–12'],['Incline machine press',2,'8–12'],['Seated leg curl',2,'10–15'],['Lateral raise',2,'12–15']]]];
let state={version:1,targets:{kcal:0,p:0,c:0,f:0,steps:8000},plans:initialPlans,days:{}};try{const v=JSON.parse(localStorage.getItem('form-v1'));if(v&&v.version===1)state=v}catch(e){}let selectedPlan=0,tab='today';const now=new Date();$('#date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const day=()=>state.days[$('#date').value]??(state.days[$('#date').value]={meals:[],sets:{},steps:'',ride:'',weight:'',waist:'',notes:''});function save(){try{localStorage.setItem('form-v1',JSON.stringify(state));$('#status').textContent='Saved on this device.'}catch(e){$('#status').textContent='Storage unavailable or full. Export a backup before leaving.'}}
function totals(){return day().meals.reduce((a,m)=>{['kcal','p','c','f'].forEach(k=>a[k]+=Number(m[k])||0);return a},{kcal:0,p:0,c:0,f:0})}function cards(){const t=totals();return '<div class="stats">'+[['kcal','Calories','kcal'],['p','Protein','g'],['c','Carbs','g'],['f','Fat','g']].map(([k,n,u])=>`<div class="stat"><small>${n}</small><strong>${Math.round(t[k])}<small> ${u}</small></strong><small>${state.targets[k]?'of '+state.targets[k]:'Target unset'}</small>${state.targets[k]?`<progress aria-label="${n}" max="${state.targets[k]}" value="${t[k]}"></progress>`:''}</div>`).join('')+'</div>'}
function render(){['today','train','food','progress','settings'].forEach(x=>$('#'+x).classList.toggle('hidden',tab!==x));$('#nav').innerHTML=['today','train','food','progress','settings'].map(x=>`<button data-tab="${x}" class="${tab===x?'active':''}">${({today:'Today',train:'Workouts',food:'Meals',progress:'Progress',settings:'Settings'})[x]}</button>`).join('');const d=day();
$('#today').innerHTML=`<h2>Your daily check-in</h2>${cards()}<div class="grid" style="margin-top:16px"><div class="card"><h3>Move at your pace</h3><p class="muted">Start near your 7–8k baseline. Increase gradually if recovery and your back allow.</p><label>Steps • goal ${state.targets.steps}<input type="number" min="0" max="100000" data-day="steps" value="${esc(d.steps)}"></label><label>Zwift minutes • optional 30-minute easy ride<input type="number" min="0" max="1440" data-day="ride" value="${esc(d.ride)}"></label></div><div class="card"><h3>Recovery matters</h3><label>Morning weight (kg)<input type="number" min="1" max="500" step="0.1" data-day="weight" value="${esc(d.weight)}"></label><label>Waist (cm), optional<input type="number" min="1" max="300" step="0.1" data-day="waist" value="${esc(d.waist)}"></label><label>Energy, sleep, back symptoms<textarea data-day="notes">${esc(d.notes)}</textarea></label></div></div><div class="card note"><strong>This week:</strong> Mon A · Tue B lighter · Wed recovery / optional ride · Thu C · Fri recovery / optional ride · Sat D lighter · Sun recovery. Move sessions as needed; take extra rest if sore or fatigued.</div>`;
const plan=state.plans[selectedPlan];$('#train').innerHTML=`<h2>Full body, four ways</h2><div class="card note"><strong>Warm up without tiring yourself out.</strong> Start with 5–8 minutes of easy cycling or walking at a conversational pace, whichever is comfortable. Then do 1–2 light practice sets before the first leg and upper-body exercises. Save the optional 30-minute Zwift ride for afterward or a separate session.<p>Start with two working sets, leave about 3 reps in reserve, and rest 90–120 seconds (60–90 for small isolation exercises). Tuesday and Saturday: keep effort lighter. Add a small amount of weight only after reaching the top of the rep range on all sets with controlled, comfortable technique.</p><strong>Back symptoms:</strong> This is a general gym template, not treatment. Arrange assessment for your persistent pain before increasing load. Stop or substitute any movement that worsens symptoms. No exercise here is guaranteed to suit your back.</div><label>Choose workout<select id="plan">${state.plans.map((p,i)=>`<option value="${i}" ${i===selectedPlan?'selected':''}>${esc(p[0])}</option>`).join('')}</select></label><div class="card"><span class="pill">${esc(plan[0])} · STARTER PLAN</span>${plan[1].map((e,i)=>`<div class="exercise"><label>Exercise / substitution<input data-ex="${i}" value="${esc(e[0])}"></label><p class="muted">${e[1]} sets × ${esc(e[2])} reps</p><div class="set"><small>Set</small><small>Weight (kg)</small><small>Reps</small><small>✓</small></div>${Array.from({length:e[1]},(_,j)=>{const k=selectedPlan+'-'+i+'-'+j,s=d.sets[k]||{};return `<div class="set"><span>${j+1}</span><input aria-label="Exercise ${i+1} set ${j+1} weight" type="number" min="0" max="1000" step="0.5" data-set="${k}" data-field="kg" value="${esc(s.kg||'')}"><input aria-label="Exercise ${i+1} set ${j+1} reps" type="number" min="0" max="200" data-set="${k}" data-field="reps" value="${esc(s.reps||'')}"><input aria-label="Exercise ${i+1} set ${j+1} complete" type="checkbox" data-set="${k}" data-field="done" ${s.done?'checked':''}></div>`}).join('')}</div>`).join('')}</div>`;
$('#food').innerHTML=`<h2>Meals, made simple</h2>${cards()}<form id="mealForm" class="card"><h3>Add a meal</h3><label>Meal<select name="type"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><label>Food / meal name<input name="name" required maxlength="150" placeholder="e.g. Yogurt, oats & berries"></label><div class="grid">${[['kcal','Calories'],['p','Protein (g)'],['c','Carbs (g)'],['f','Fat (g)']].map(([k,l])=>`<label>${l}<input name="${k}" type="number" min="0" max="10000" step="0.1" required></label>`).join('')}</div><button class="primary wide">Save meal</button></form><div class="card"><h3>Logged for ${esc($('#date').value)}</h3>${d.meals.length?d.meals.map((m,i)=>`<div class="meal"><div><small>${esc(m.type)}</small><p>${esc(m.name)}</p><small>${m.kcal} kcal · P ${m.p} · C ${m.c} · F ${m.f} g</small></div><button data-remove="${i}" aria-label="Delete ${esc(m.name)}">Delete</button></div>`).join(''):'<p class="muted">No meals yet. Start with your next meal.</p>'}</div>`;
const entries=Object.entries(state.days).sort((a,b)=>b[0].localeCompare(a[0]));const recent=entries.filter(([k,v])=>v.weight&&k<=$('#date').value&&((new Date($('#date').value+'T12:00:00')-new Date(k+'T12:00:00'))/86400000)<7);$('#progress').innerHTML=`<h2>Consistency over perfection</h2><div class="card"><small>7-day mean weight through selected date</small><h2>${recent.length?(recent.reduce((a,[k,v])=>a+Number(v.weight),0)/recent.length).toFixed(1)+' kg':'No weight entries yet'}</h2><p class="muted">${recent.length} weigh-ins. Watch trends alongside waist, strength, and recovery.</p></div><div class="card" style="overflow:auto"><table><thead><tr><th>Date</th><th>Weight kg</th><th>Steps</th><th>Ride min</th><th>Sets done</th></tr></thead><tbody>${entries.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v.weight||'—')}</td><td>${esc(v.steps||'—')}</td><td>${esc(v.ride||'—')}</td><td>${Object.values(v.sets).filter(s=>s.done).length}</td></tr>`).join('')}</tbody></table></div>`;
$('#settings').innerHTML=`<h2>Make it yours</h2><div class="card note"><h3>Starting profile</h3>29 · Male · 176 cm · 88 kg at setup. Estimated resting needs ≈1,840 kcal/day (Mifflin–St Jeor), not maintenance. Your reported 2,200–2,500 needs clarification before choosing a deficit. Targets start unset; use an agreed plan rather than automatically subtracting exercise calories.</div><div class="card"><h3>Daily targets</h3>${[['kcal','Calories'],['p','Protein (g)'],['c','Carbs (g)'],['f','Fat (g)'],['steps','Steps']].map(([k,n])=>`<label>${n}<input data-target="${k}" type="number" min="0" max="${k==='steps'?100000:10000}" value="${state.targets[k]}"></label>`).join('')}<p class="muted note">0 leaves a macro target unset. Calories and macros are independently entered from your plan.</p></div><div class="card"><h3>Your data, your backup</h3><p class="note muted">Stored only in this browser. Clearing site data deletes it. GitHub Pages hosts the app, not your logs. Export to move devices or keep a backup. Imports replace current data after confirmation.</p><button id="export">Export JSON</button><label>Import backup<input id="import" type="file" accept="application/json"></label></div><div class="card note"><h3>Guidance</h3><a href="https://www.nhs.uk/conditions/back-pain/">NHS: back pain and when to get help</a><p>Seek urgent care for new bladder/bowel changes, groin numbness, or weakness in both legs.</p><a href="https://acsm.org/resistance-training-guidelines-update-2026/">ACSM: resistance training guidance for healthy adults</a></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.remove!==undefined){day().meals.splice(Number(b.dataset.remove),1);save();render()}if(b.id==='export'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='form-backup-'+$('#date').value+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='date'){if(t.value)render();return}if(t.id==='plan'){selectedPlan=Number(t.value);render();return}if(t.matches('[data-day]')){if(t.type==='number'&&!t.checkValidity()){t.reportValidity();return}day()[t.dataset.day]=t.value;save()}if(t.dataset.set){if(t.type==='number'&&!t.checkValidity()){t.reportValidity();return}const s=day().sets[t.dataset.set]??(day().sets[t.dataset.set]={});s[t.dataset.field]=t.type==='checkbox'?t.checked:t.value;save()}if(t.dataset.ex!==undefined){state.plans[selectedPlan][1][Number(t.dataset.ex)][0]=t.value;save()}if(t.dataset.target){if(!t.checkValidity()){t.reportValidity();return}state.targets[t.dataset.target]=Number(t.value);save()}if(t.id==='import'&&t.files[0]){try{const v=JSON.parse(await t.files[0].text());if(v.version!==1||!v.targets||!Array.isArray(v.plans)||v.plans.length!==4||!v.days||typeof v.days!=='object')throw Error();for(const k of ['kcal','p','c','f','steps'])if(!Number.isFinite(v.targets[k])||v.targets[k]<0)throw Error();v.plans.forEach(p=>{if(typeof p[0]!=='string'||!Array.isArray(p[1]))throw Error();p[1].forEach(e=>{if(typeof e[0]!=='string'||!Number.isInteger(e[1])||e[1]<1||e[1]>10||typeof e[2]!=='string')throw Error()})});Object.entries(v.days).forEach(([k,d])=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(d.meals)||!d.sets||typeof d.sets!=='object')throw Error();d.meals.forEach(m=>{if(typeof m.name!=='string'||typeof m.type!=='string'||['kcal','p','c','f'].some(x=>!Number.isFinite(m[x])||m[x]<0))throw Error()})});if(confirm('Replace all current logs and settings with this backup?')){state=v;save();render()}}catch(e){$('#status').textContent='Invalid backup. Your data was not changed.'}}});
document.addEventListener('submit',e=>{if(e.target.id!=='mealForm')return;e.preventDefault();const f=new FormData(e.target),m={name:f.get('name'),type:f.get('type')};['kcal','p','c','f'].forEach(k=>m[k]=Number(f.get(k)));day().meals.push(m);save();render()});render();
</script></html>
